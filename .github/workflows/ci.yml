name: CI

# Every pull request into dev or main. Merging needs these checks green (the rulesets require them).
# Pushes run nothing here: dev only receives what a pull request already tested, and main only
# receives releases (release.yml).

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests into main are releases: from a release-X.Y.Z branch, with the versions and a dated
  # CHANGELOG.md section for X.Y.Z.
  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions and changelog
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          V="${BRANCH#release-}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Releases come from release-X.Y.Z branches, not $BRANCH"
            exit 1
          fi
          for f in server/package.json selector/package.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$V" ]; then
              echo "$f says $got, the release is $V"
              exit 1
            fi
          done
          if ! grep -qE "^version: $V$" charts/renplay/Chart.yaml || ! grep -qE "^appVersion: \"$V\"$" charts/renplay/Chart.yaml; then
            echo "charts/renplay/Chart.yaml needs version and appVersion $V"
            exit 1
          fi
          if ! grep -qE "^## \[$V\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## [$V] - YYYY-MM-DD' section"
            exit 1
          fi

  # The code, the docs, the chart and the workflows, in one job.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            selector/package-lock.json
            docs/site/package-lock.json

      - name: Server
        working-directory: server
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

      - name: Runtime
        run: node --check runtime/renplay-runtime.js

      # No semicolons, em or en dashes, or ellipses in text people read (AGENTS.md).
      - name: Writing rule
        run: node scripts/check-copy.mjs --docs

      - name: Library interface
        working-directory: selector
        run: |
          npm ci
          npx tsc -b --noEmit
          npm run build
          node ../scripts/check-dist.mjs

      # The configuration page is generated from server/src/envvars.ts. The build fails on broken links.
      - name: Docs
        working-directory: docs/site
        run: |
          npm ci
          npm run check:config
          npm run build

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Chart
        run: |
          pip install --quiet PyYAML==6.0.2
          helm lint charts/renplay --strict
          python3 deploy/test-chart.py
          python3 deploy/test-package-chart.py
          docker run --rm -u "$(id -u)" -v "$PWD:/helm-docs" jnorwood/helm-docs:v1.14.2 --chart-search-root charts/renplay
          git diff --exit-code -- charts/renplay/README.md

      - name: Workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
          pipx run zizmor==1.32.0 --persona regular --min-severity medium .github/workflows

  # The image, built from the cache earlier runs filled, against the install contract on both
  # architectures, and the chart installed on kind with it.
  contract:
    name: Install contract (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cache is written by pull requests from this repository. Dependabot's have a read-only
      # token, so writing is allowed to fail.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            renplay:contract
            ghcr.io/renplay-org/renplay:chart-test
          cache-from: type=registry,ref=ghcr.io/renplay-org/renplay-cache:${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/renplay-org/renplay-cache:${{ matrix.arch }},mode=max,ignore-error=true

      - name: User IDs and read-only root filesystem
        run: python3 deploy/test-contract.py renplay:contract users
      - name: Native Ren'Py install and game HTTP smoke test
        run: python3 deploy/test-contract.py renplay:contract smoke
      - name: Upgrade and downgrade from 2.11.1
        run: python3 deploy/test-contract.py renplay:contract upgrade
      - name: Upgrade and downgrade from 3.2.0
        run: python3 deploy/test-contract.py renplay:contract upgrade32
      - name: Separate downloads mount
        run: python3 deploy/test-contract.py renplay:contract all --downloads

      - if: matrix.arch == 'amd64'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      # kind comes with the runner image. The chart's own test pod checks the service answers.
      - name: The chart on kind
        if: matrix.arch == 'amd64'
        run: |
          kind version
          kind create cluster --name chart --wait 120s
          kind load docker-image ghcr.io/renplay-org/renplay:chart-test --name chart
          helm install renplay charts/renplay --namespace renplay --create-namespace \
            --set image.tag=chart-test --set image.pullPolicy=Never --wait --timeout 5m
          helm test renplay --namespace renplay --timeout 5m
