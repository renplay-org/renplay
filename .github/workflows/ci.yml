name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  packages: write

jobs:
  # Pull requests into main are releases: from a release-X.Y.Z branch, with
  # the versions and a dated CHANGELOG.md section for X.Y.Z.
  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions and changelog
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          V="${BRANCH#release-}"
          V="${V#v}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Releases come from release-X.Y.Z branches, not $BRANCH"
            exit 1
          fi
          for f in server/package.json selector/package.json; do
            got=$(node -p "require('./$f').version")
            if [ "$got" != "$V" ]; then
              echo "$f says $got, the release is $V"
              exit 1
            fi
          done
          if ! grep -qE "^## \[$V\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md needs a '## [$V] - YYYY-MM-DD' section"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Typecheck server
        run: npx tsc --noEmit
        working-directory: server

      - name: Run server tests
        run: npx vitest run
        working-directory: server

      - name: Check runtime script
        run: node --check runtime/renplay-runtime.js

      - name: Install selector deps
        run: npm ci
        working-directory: selector

      - name: Typecheck selector
        run: npx tsc -b --noEmit
        working-directory: selector

      - name: Build selector
        run: npm run build
        working-directory: selector

  build:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository }}:edge
            ghcr.io/${{ github.repository }}:${{ github.sha }}
