name: Docs

# Builds the docs site (docs/site, Starlight) on pull requests, and deploys it to
# https://docs.renplay.org on every push to main, so the docs describe the released version.
on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'server/src/envvars.ts', '.github/workflows/docs.yml']
  pull_request:
    branches: [main, dev]
    paths: ['docs/site/**', 'server/src/envvars.ts', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # The configuration page is generated from server/src/envvars.ts.
      - name: Configuration page is up to date
        run: npm run check:config

      # Fails on broken links too (starlight-links-validator).
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/site/dist
          retention-days: 7

  deploy:
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - run: npm run build

      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
