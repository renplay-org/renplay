name: Release

# main only receives releases (a squash-merged release-X.Y.Z branch, CI's release-check). The version
# is server/package.json's, and it is released once: when its tag does not exist yet.
#
# Order: the image, the chart (signed), then the tag and GitHub release, so nothing announces an
# image that is not there. The docs and the demo follow.
#
# The chart is signed in this file, not a reusable workflow: deployments verify the signature against
# the identity .github/workflows/release.yml@refs/heads/main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          v=$(node -p "require('./server/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is released already"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Releasing $v"
          fi

  image:
    needs: version
    if: needs.version.outputs.new == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tags: |
        ghcr.io/renplay-org/renplay:${{ needs.version.outputs.version }}
        ghcr.io/renplay-org/renplay:latest
        docker.io/renplay/renplay:${{ needs.version.outputs.version }}
        docker.io/renplay/renplay:latest
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  chart:
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      CHART_REPOSITORY: ghcr.io/renplay-org/charts/renplay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish the chart
        run: |
          pip install --quiet PyYAML==6.0.2
          python3 scripts/package-chart.py "$VERSION" "$IMAGE_DIGEST"
          helm lint charts/renplay --strict
          helm package charts/renplay --version "$VERSION" --app-version "$VERSION"
          helm push "renplay-${VERSION}.tgz" oci://ghcr.io/renplay-org/charts
      - name: Publish Artifact Hub repository metadata
        working-directory: charts/renplay
        run: |
          oras push "${CHART_REPOSITORY}:artifacthub.io" \
            --artifact-type application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign the chart with GitHub OIDC
        run: |
          DIGEST=$(oras resolve "${CHART_REPOSITORY}:${VERSION}")
          cosign sign --yes "${CHART_REPOSITORY}@${DIGEST}"

  github-release:
    needs: [version, chart]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag and release with the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $V"; exit 1; }
          gh release create "v$V" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "Renplay $V" --notes-file notes.md --latest

  sites:
    needs: github-release
    permissions:
      contents: read
    uses: ./.github/workflows/sites.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  demo:
    needs: [version, github-release]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/demo.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      DEMO_DEPLOY_HOOK: ${{ secrets.DEMO_DEPLOY_HOOK }}
