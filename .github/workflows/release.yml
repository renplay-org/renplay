name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from merge commit
        id: extract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=""
          MSG=$(git log -1 --format=%s)
          echo "Commit message: $MSG"

          # Strategy 1: Standard merge commit
          # "Merge pull request #N from org/release-v0.1.1"
          if echo "$MSG" | grep -qE 'release-([vV]?[0-9]+\.[0-9]+\.[0-9]+)'; then
            VERSION=$(echo "$MSG" | sed -nE 's/.*release-([vV]?[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
            echo "Strategy 1 matched: $VERSION"

          # Strategy 2: Squash merge — extract PR number, get branch via API
          elif echo "$MSG" | grep -qE '\(#[0-9]+\)$'; then
            PR=$(echo "$MSG" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
            echo "Strategy 2: PR #$PR"
            BRANCH=$(gh pr view "$PR" --json headRefName --jq '.headRefName' 2>/dev/null || echo "")
            echo "Source branch: $BRANCH"
            if echo "$BRANCH" | grep -qE 'release-([vV]?[0-9]+\.[0-9]+\.[0-9]+)'; then
              VERSION=$(echo "$BRANCH" | sed -nE 's/.*release-([vV]?[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
              echo "Strategy 2 matched: $VERSION"
            fi

          # Strategy 3: Version string anywhere in message
          # "Release v0.1.1 (#123)" or "v0.1.1"
          elif echo "$MSG" | grep -qE '(^|[^0-9])([vV]?[0-9]+\.[0-9]+\.[0-9]+)'; then
            VERSION=$(echo "$MSG" | sed -nE 's/.*([vV]?[0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
            echo "Strategy 3 matched: $VERSION"
          fi

          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Final version: [$VERSION]"

  create:
    needs: [detect]
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ needs.detect.outputs.version }}"
          TAG="v$V"
          # The release notes are the version's section of CHANGELOG.md.
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f = 1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $V"
            exit 1
          fi
          if gh release view "$TAG" --json name > /dev/null 2>&1; then
            echo "Release $TAG already exists — skipping"
          else
            gh release create "$TAG" \
              --target "${{ github.sha }}" \
              --title "Renplay $V" \
              --notes-file notes.md \
              --latest
          fi

  build:
    needs: [detect]
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.detect.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker.io/renplay/renplay:${{ needs.detect.outputs.version }}
            docker.io/renplay/renplay:latest

  helm:
    needs: [detect, build]
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      CHART_REPOSITORY: ghcr.io/renplay-org/charts/renplay
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oras-project/setup-oras@v1
      - uses: sigstore/cosign-installer@v3.8.2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish chart
        run: |
          python3 -m venv /tmp/chart-tools
          /tmp/chart-tools/bin/pip install PyYAML
          /tmp/chart-tools/bin/python deploy/package-chart.py "$VERSION" "$IMAGE_DIGEST"
          helm lint charts/renplay --strict
          helm package charts/renplay --version "$VERSION" --app-version "$VERSION"
          helm push "renplay-${VERSION}.tgz" oci://ghcr.io/renplay-org/charts
      - name: Publish Artifact Hub repository metadata
        working-directory: charts/renplay
        run: |
          oras push "${CHART_REPOSITORY}:artifacthub.io" \
            --artifact-type application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
      - name: Sign the published chart with GitHub OIDC
        run: |
          DIGEST=$(oras resolve "${CHART_REPOSITORY}:${VERSION}")
          cosign sign --yes "${CHART_REPOSITORY}@${DIGEST}"
