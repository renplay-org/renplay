name: Bug Report
description: Report a problem with Renplay
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.

        If a game fails to install, attach the job log (Activity → Log). If it installs but misbehaves,
        include the browser console output from the game page.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Go to '…'
        2. Click on '…'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Server logs, browser console errors, or screenshots.
      render: shell

  - type: input
    id: game
    attributes:
      label: Game and archive
      description: Game title, version and the archive file name you installed from (if the bug is game-specific)

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: e.g., Safari 26 on iPad, Chrome on macOS

  - type: input
    id: version
    attributes:
      label: Renplay Version
      description: Shown at the bottom of Settings, or the image tag you run
    validations:
      required: true

  - type: input
    id: renpy-version
    attributes:
      label: Ren'Py version of the game
      description: Shown on the game's Details tab, e.g., 8.3.4
