      <stop offset="0" stop-color="#d62a68"/>
      <stop offset="1" stop-color="#7556f0"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.2" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#ffc58a" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#ffc58a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffc58a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#lamp)"/>
