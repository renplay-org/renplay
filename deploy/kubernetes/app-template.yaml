# Renplay with bjw-s app-template 5 instead of the Renplay chart, for clusters that already use it.
# https://docs.renplay.org/install/kubernetes/#already-using-app-template
#
#   helm install renplay oci://ghcr.io/bjw-s-labs/helm/app-template --version 5.3.0 \
#     --namespace renplay --create-namespace -f app-template.yaml
controllers:
  main:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/renplay-org/renplay
          tag: 4.5.1
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet: {path: /api/health, port: 8080}
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
service:
  app:
    controller: main
    ports:
      http:
        port: 8080
persistence:
  data:
    existingClaim: renplay-data
    globalMounts:
      - path: /data
  games:
    existingClaim: renplay-games
    globalMounts:
      - path: /games
  tmp:
    type: emptyDir
