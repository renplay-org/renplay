# Renplay with Docker Compose: https://docs.renplay.org/install/docker/
#
#   mkdir -p games data
#   sudo chown 1000:1000 games data
#   docker compose up -d
#
# Then open http://<your server>:8080. To upgrade, change the version below and run
# `docker compose up -d` again.
services:
  renplay:
    image: ghcr.io/renplay-org/renplay:4.3.1
    container_name: renplay
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./games:/games
      - ./data:/data
