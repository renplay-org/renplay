# An nginx site in front of Renplay: https://docs.renplay.org/install/reverse-proxy/
# Set RENPLAY_PUBLIC_URL to the https:// address and RENPLAY_TRUSTED_HOPS to 2 in Renplay.
server {
  listen 443 ssl;
  http2 on;
  server_name renplay.example.com;
  ssl_certificate /etc/ssl/renplay/fullchain.pem;
  ssl_certificate_key /etc/ssl/renplay/privkey.pem;

  location / {
    proxy_pass http://renplay:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Games stream in ranges and download for minutes: pass them through as they come.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    # Uploads arrive in chunks of 32 MB.
    client_max_body_size 40m;
  }
}
