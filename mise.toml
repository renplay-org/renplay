# Tools for working on Renplay, and where the tasks are. `mise install` installs the tools, `mise run
# install` the npm packages, and `mise tasks` lists the rest (in tasks.toml). CI runs these same tasks
# (.github/workflows/ci.yml), and caches the tools by this file alone, so a task can change without
# downloading every tool again. The release workflow sets up the same Helm and Python versions.

[tools]
node = "24"
python = "3.13"
helm = "3.17.3"
helm-docs = "1.14.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"

[task_config]
includes = ["tasks.toml"]
