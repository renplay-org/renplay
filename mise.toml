# Tools and tasks for working on Renplay. `mise install` installs the tools, `mise run install` the
# npm packages, and `mise tasks` lists the rest. CI runs these same tasks (.github/workflows/ci.yml).
# The release workflow sets up the same Helm and Python versions on its own.

[tools]
node = "24"
python = "3.13"
helm = "3.17.3"
helm-docs = "1.14.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
zizmor = "1.32.0"

# ---- setup and development --------------------------------------------------------------------

[tasks.install]
description = "Install the npm packages of the server, the library and the docs"
run = ["npm ci --prefix server", "npm ci --prefix selector", "npm ci --prefix docs/site"]

[tasks.dev]
description = "The server and the library together: open http://localhost:5199"
depends = ["dev:server", "dev:ui"]

[tasks."dev:server"]
description = "The server on port 3999, with its games and data in /tmp/rp"
dir = "server"
env = { DATA_DIR = "/tmp/rp/data", GAMES_DIR = "/tmp/rp/games", PORT = "3999", RENPLAY_RUNTIME_PATH = "{{config_root}}/runtime/renplay-runtime.js" }
run = ["npx tsc -p .", "node dist/index.js"]

[tasks."dev:ui"]
description = "The library on http://localhost:5199, against the server on port 3999 (or RENPLAY_BACKEND)"
dir = "selector"
run = "npm run dev"

[tasks.docs]
description = "The docs on http://localhost:4321"
dir = "docs/site"
run = "npm run dev"

[tasks.website]
description = "The website on http://localhost:5190 (its _redirects work only on Cloudflare)"
run = ["sh website/build.sh", "python -m http.server --directory website/dist 5190"]

[tasks.test]
description = "The server's tests"
dir = "server"
run = "npx vitest run"

[tasks.screenshots]
description = "Phone and desktop screenshots of a running Renplay: mise run screenshots <url> <dir> [--sfw]"
dir = "server"
run = "npm run screenshots --"

# ---- checks (CI runs each of these) -----------------------------------------------------------

[tasks.check]
description = "Everything CI checks, except the image"
depends = ["check:server", "check:runtime", "check:copy", "check:ui", "check:docs", "check:website", "check:chart", "check:workflows", "check:examples"]

[tasks."check:server"]
description = "Server type check and tests"
dir = "server"
run = ["npx tsc --noEmit", "npx vitest run"]

[tasks."check:runtime"]
description = "The game runtimes parse"
run = ["node --check runtime/renplay-player.js", "node --check runtime/renplay-runtime.js", "node --check runtime/renplay-html.js"]

[tasks."check:copy"]
description = "The writing rule in the interface, server messages, changelog and docs"
run = "node scripts/check-copy.mjs --docs"

[tasks."check:ui"]
description = "Library type check and build"
dir = "selector"
run = ["npx tsc -b --noEmit", "npm run build", "node ../scripts/check-dist.mjs"]

[tasks."check:docs"]
description = "Docs build, with the configuration page and every link checked"
dir = "docs/site"
run = ["npm run check:config", "npm run build"]

[tasks."check:website"]
description = "Website build, with every local link and picture checked"
run = ["sh website/build.sh", "node scripts/check-website.mjs"]

[tasks."check:chart"]
description = "Chart lint and tests, and its values reference up to date"
run = [
  "python -m pip install --quiet PyYAML==6.0.2",
  "helm lint charts/renplay --strict",
  "python tests/chart.py",
  "python tests/chart-metadata.py",
  "helm-docs --chart-search-root charts/renplay",
  "git diff --exit-code -- charts/renplay/README.md",
]

[tasks."check:workflows"]
description = "GitHub workflows: actionlint and zizmor"
run = ["actionlint", "zizmor --persona regular --min-severity medium .github/workflows"]

[tasks."check:examples"]
description = "The files people copy from deploy/ are valid (needs Docker)"
run = "sh tests/examples.sh"

# ---- image ------------------------------------------------------------------------------------

[tasks.image]
description = "Build the image as renplay:dev"
run = "docker build -t renplay:dev ."

[tasks.contract]
description = "The image's install contract, and deploy/compose.yaml starting it (needs Docker)"
depends = ["image"]
run = ["python tests/contract.py renplay:dev all", "sh tests/compose.sh renplay:dev"]

[tasks.demo]
description = "The demo's image (demo/README.md) from a released version"
usage = 'arg "<version>" help="The Renplay release to build from, like 4.4.0"'
run = "sh demo/build-games.sh 8.5.3 demo/games && docker build --build-arg IMAGE=ghcr.io/renplay-org/renplay:${usage_version} -t renplay-demo demo"

# ---- releases ---------------------------------------------------------------------------------

[tasks.release]
description = "Prepare a release branch: mise run release <X.Y.Z> (see .agents/skills/release)"
run = "node scripts/release.mjs"
